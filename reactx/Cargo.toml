[package]
name = "reactx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true
description = "A React-style TUI framework built on Dioxus, Taffy and Ratatui"
readme = "../README.md"
keywords = ["tui", "terminal", "dioxus", "ui", "framework"]
categories = ["command-line-interface", "gui"]

[features]
default = ["async", "router"]
# `use_fetch`, `use_websocket` and the network stack behind them.
async = ["dep:reactx-async"]
# `Router`, `routes!`, `Link`, `use_param`, `navigate`.
router = ["dep:reactx-router"]

[dependencies]
dioxus.workspace = true
reactx-core.workspace = true
reactx-tui.workspace = true
reactx-ui.workspace = true
reactx-async = { workspace = true, optional = true }
reactx-router = { workspace = true, optional = true }
reactx-macro.workspace = true

[dev-dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
ratatui.workspace = true
