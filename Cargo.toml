[workspace]
members = [
    "crates/reactx-core",
    "crates/reactx-tui",
    "crates/reactx-ui",
    "crates/reactx-async",
    "crates/reactx-router",
    "crates/reactx-macro",
    "reactx",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.79"
license = "MIT"
license-file = "LICENSE"

[workspace.dependencies]
# VDOM engine
dioxus = { version = "0.6.3", default-features = false, features = ["macro", "html", "hooks", "signals"] }
dioxus-core = "0.6.3"
dioxus-html = "0.6.3"
dioxus-signals = "0.6.3"

# Terminal backend
ratatui = { version = "0.29", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = { version = "0.28", features = ["event-stream"] }
taffy = "0.5.2"
# 0.16 is the last line supporting ratatui 0.29; 0.17+ want crossterm 0.29 and
# 0.23+ want ratatui 0.30.
tachyonfx = { version = "0.16", default-features = false, features = ["std-duration"] }

# Async + networking
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "charset", "http2", "rustls-tls"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

# Utilities
unicode-width = "0.2"
unicode-segmentation = "1"
unicode-truncate = "1"
textwrap = "0.16"
base64 = "0.22"
form_urlencoded = "1"
percent-encoding = "2"
matchit = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustc-hash = "2"

# Internal crates
reactx-core = { path = "crates/reactx-core", version = "0.1.1" }
reactx-tui = { path = "crates/reactx-tui", version = "0.1.2" }
reactx-ui = { path = "crates/reactx-ui", version = "0.1.2" }
reactx-async = { path = "crates/reactx-async", version = "0.1.1" }
reactx-router = { path = "crates/reactx-router", version = "0.1.1" }
reactx-macro = { path = "crates/reactx-macro", version = "0.1.1" }

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 1
